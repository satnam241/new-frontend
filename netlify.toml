[build]
  command = "npm run build"
  publish = "dist"

# Proxy API and uploads to the backend (mirrors vercel.json)
[[redirects]]
  from = "/api/*"
  to = "https://new-backend-pied.vercel.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://new-backend-pied.vercel.app/uploads/:splat"
  status = 200
  force = true

# SPA fallback so client-side routes (e.g. /admin, /p/:slug) don't 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
